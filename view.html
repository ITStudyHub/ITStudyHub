<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITStudyHub - Secure PDF</title>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; 
            background-color: #525659; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            transition: filter 0.2s ease, opacity 0.2s ease;
        }
        
        @media print { body { display: none !important; } }
        
        body.security-blur { filter: blur(25px) grayscale(100%); opacity: 0; background: black; }
        
        #pdf-container {
            display: flex; flex-direction: column; 
            align-items: center; 
            padding: 20px 0; 
            gap: 15px; 
        }
        
        .page-wrapper {
            width: 95%; 
            max-width: 800px; 
            min-height: 50vh;
            display: flex; justify-content: center;
            background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="50" x="50" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="5" fill="%23ccc">Loading...</text></svg>') center center no-repeat;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            border-radius: 6px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100% !important; 
            height: auto !important;
            display: block; 
        }

        .dynamic-counter {
            position: fixed;
            right: 0px; 
            top: 10%; 
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #202124;
            padding: 10px 18px 10px 14px;
            border-radius: 25px 0 0 25px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            box-shadow: -2px 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #ddd;
            border-right: none;
            z-index: 1000;
            pointer-events: none; 
            opacity: 0; 
            visibility: hidden;
            transition: opacity 0.3s ease, top 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), visibility 0.3s; 
        }

        .dynamic-counter.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="pdf-container"></div>

    <div class="dynamic-counter" id="page-counter">
        <span id="current-page">1</span> / <span id="total-pages">0</span>
    </div>

    <script>
        /* SECURITY FEATURES */
        document.addEventListener('keyup', (e) => {
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText(''); 
                alert("Security Alert: Screenshots are disabled!");
            }
        });
        
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) { 
                e.preventDefault(); 
            }
        });

        window.addEventListener('blur', () => document.body.classList.add('security-blur'));
        window.addEventListener('focus', () => document.body.classList.remove('security-blur'));

        /* PDF RENDERER */
        const urlParams = new URLSearchParams(window.location.search);
        const pdfFile = urlParams.get('file');

        if (pdfFile) {
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            const container = document.getElementById('pdf-container');
            const counterBox = document.getElementById('page-counter');
            let pdfDocument = null;
            let scrollTimer = null; 

            const HD_SCALE = window.devicePixelRatio || 2.5; 

            /* SCROLL TRACKER */
            window.addEventListener('scroll', () => {
                counterBox.classList.add('show');

                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                if (maxScroll > 0) {
                    const scrollPercent = window.scrollY / maxScroll;
                    const topPos = 10 + (scrollPercent * 80); 
                    counterBox.style.top = topPos + '%';
                }

                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(() => {
                    counterBox.classList.remove('show');
                }, 1500); 
            });

            const loadObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !entry.target.dataset.rendered) {
                        const pageNum = parseInt(entry.target.dataset.page);
                        renderHDPage(pageNum, entry.target);
                    }
                });
            }, { rootMargin: "500px 0px", threshold: 0.01 });

            const countObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNum = parseInt(entry.target.dataset.page);
                        document.getElementById('current-page').innerText = pageNum;
                    }
                });
            }, { rootMargin: "-45% 0px -45% 0px", threshold: 0 }); 

            pdfjsLib.getDocument(pdfFile).promise.then(pdf => {
                pdfDocument = pdf;
                document.getElementById('total-pages').innerText = pdf.numPages;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'page-wrapper';
                    wrapper.dataset.page = i;
                    container.appendChild(wrapper);
                    
                    loadObserver.observe(wrapper);
                    countObserver.observe(wrapper);
                }
            });

            function renderHDPage(num, wrapper) {
                wrapper.dataset.rendered = "true"; 
                
                pdfDocument.getPage(num).then(page => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const viewport = page.getViewport({ scale: 2.0 }); 
                    canvas.width = Math.floor(viewport.width * HD_SCALE);
                    canvas.height = Math.floor(viewport.height * HD_SCALE);
                    
                    const renderContext = {
                        canvasContext: ctx,
                        transform: [HD_SCALE, 0, 0, HD_SCALE, 0, 0],
                        viewport: viewport
                    };

                    page.render(renderContext).promise.then(() => {
                        wrapper.innerHTML = ''; 
                        wrapper.appendChild(canvas);
                        wrapper.style.background = 'none';
                    });
                });
            }
        } else {
            document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>Error: No File Found</h2>";
        }
    </script>
</body>
</html>
