<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure PDF Viewer - ITStudyHub</title>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        /* બધી જ સિક્યોરિટી અને ડિઝાઇન માટેનું CSS */
        body {
            margin: 0;
            padding: 0;
            background-color: #081119; /* ડાર્ક થીમ */
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* સિલેક્શન અને કોપી રોકવા માટે */
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* પ્રિન્ટિંગ (Ctrl+P) રોકવા માટે */
        @media print {
            body { display: none !important; }
        }

        .toolbar {
            background-color: #12212f;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .toolbar-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background-color: #00a8e8;
            color: black;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #fff;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .pdf-container {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto !important; /* મોબાઈલમાં સારું દેખાય તે માટે */
        }

        .loading {
            color: #00a8e8;
            font-family: sans-serif;
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<!-- રાઇટ ક્લિક બંધ કરવા માટે oncontextmenu="return false;" -->
<body oncontextmenu="return false;">

    <div class="toolbar">
        <div id="document-title" style="font-weight: bold; font-size: 1.1rem; color: #00a8e8;">Loading...</div>
        <div class="toolbar-controls">
            <button id="prev-page">Prev</button>
            <span>Page: <span id="page-num">0</span> / <span id="page-count">0</span></span>
            <button id="next-page">Next</button>
        </div>
    </div>

    <div class="pdf-container" id="pdf-container">
        <div class="loading" id="loading-msg">Loading Secure Document...</div>
        <canvas id="pdf-render" style="display: none;"></canvas>
    </div>

    <script>
        // કીબોર્ડના શોર્ટકટ (Ctrl+S, Ctrl+P) બંધ કરવા
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's')) {
                e.preventDefault();
                alert('Downloading and Printing is disabled for security.');
            }
        });

        // URL માંથી PDF ફાઈલનું નામ મેળવવું
        const urlParams = new URLSearchParams(window.location.search);
        const pdfFile = urlParams.get('file');

        if (!pdfFile) {
            document.getElementById('loading-msg').innerText = "Error: No PDF file specified.";
        } else {
            document.getElementById('document-title').innerText = "ITStudyHub - Secure Viewer";

            // PDF.js સેટઅપ
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            let pdfDoc = null,
                pageNum = 1,
                pageIsRendering = false,
                pageNumIsPending = null;

            const scale = 1.5,
                  canvas = document.getElementById('pdf-render'),
                  ctx = canvas.getContext('2d');

            // પેજ રેન્ડર (દોરવા) માટેનું ફંક્શન
            const renderPage = num => {
                pageIsRendering = true;
                
                pdfDoc.getPage(num).then(page => {
                    const viewport = page.getViewport({ scale });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderCtx = {
                        canvasContext: ctx,
                        viewport: viewport
                    };

                    page.render(renderCtx).promise.then(() => {
                        pageIsRendering = false;
                        document.getElementById('loading-msg').style.display = 'none';
                        canvas.style.display = 'block';

                        if (pageNumIsPending !== null) {
                            renderPage(pageNumIsPending);
                            pageNumIsPending = null;
                        }
                    });

                    document.getElementById('page-num').textContent = num;
                });
            };

            // પેજ ક્યુમાં મૂકવા
            const queueRenderPage = num => {
                if (pageIsRendering) {
                    pageNumIsPending = num;
                } else {
                    renderPage(num);
                }
            };

            // પાછળનું પેજ
            const showPrevPage = () => {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            };

            // આગળનું પેજ
            const showNextPage = () => {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            };

            // PDF લોડ કરવી
            pdfjsLib.getDocument(pdfFile).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('page-count').textContent = pdfDoc.numPages;
                renderPage(pageNum);
            }).catch(err => {
                document.getElementById('loading-msg').innerText = "Error loading PDF. File might be missing.";
                console.error(err);
            });

            // બટન ઇવેન્ટ્સ
            document.getElementById('prev-page').addEventListener('click', showPrevPage);
            document.getElementById('next-page').addEventListener('click', showNextPage);
        }
    </script>
</body>
</html>
